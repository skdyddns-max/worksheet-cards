<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>용디쌤 그림 카드</title>
<style>
:root{--bg:#F6FBF8;--ink:#1F2A24;--green:#2E7D5B;--deep:#1F4D3A;--soft:#CFE6D8;--mute:#6B7A72;--warm:#E0714D;--card:#fff;--gold:#F3C84B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:17px;margin:0;color:var(--deep);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--soft);color:var(--deep);white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 14px}
footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.big{min-width:64px;height:64px;border-radius:20px;background:#fff;border:2px solid var(--soft);font-size:26px;font-weight:800;color:var(--deep);padding:0 16px}
.big:active{transform:scale(.96)}
.big.main{background:var(--green);border-color:var(--green);color:#fff;flex:1;max-width:260px;font-size:21px}
.big[disabled]{opacity:.35}
.msg{color:var(--mute);font-size:16px;text-align:center;line-height:1.6;padding:24px}
.hide{display:none!important}

/* 카드 */
.pic{position:relative;flex:1;min-height:0;width:100%;max-width:760px;display:flex;align-items:center;justify-content:center;container-type:size}
.pic .frame{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);background:#F5F0E1;border:2px solid var(--soft);border-radius:26px;overflow:hidden;
  box-shadow:0 6px 22px rgba(31,77,58,.10)}
.pic img,.pic video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.pic img.f{opacity:0;transition:opacity .22s}
.pic img.f.on{opacity:1}
.step{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(31,77,58,.88);color:#fff;font-weight:800;font-size:18px;padding:6px 14px;border-radius:999px;white-space:nowrap}
.word{min-height:64px;display:flex;align-items:center;justify-content:center;margin-top:10px;font-size:clamp(30px,8vw,52px);font-weight:900;color:var(--deep);letter-spacing:.02em}
.word button{font-size:20px;font-weight:800;color:var(--green);background:#fff;border:2px dashed var(--soft);border-radius:18px;padding:12px 22px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 14px 0;max-width:100%}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--soft)}
.dots i.on{background:var(--green);transform:scale(1.25)}

/* 장면 */
.scwrap{flex:1;min-height:0;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px;border:2px solid var(--soft);background:#FDFBF4;touch-action:pan-x pan-y pinch-zoom;display:flex}
.scn{position:relative;width:100%;margin:auto;flex:none}
.scn img{width:100%;display:block}
.mk{position:absolute;transform:translate(-50%,-50%);width:clamp(34px,5.2vw,48px);height:clamp(34px,5.2vw,48px);border-radius:50%;background:#fff;border:3px solid var(--green);
  color:var(--deep);font-weight:900;font-size:clamp(16px,2.6vw,22px);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.mk.sel{background:var(--green);color:#fff;transform:translate(-50%,-50%) scale(1.25)}
.mk.ok{background:var(--gold);border-color:#C99A16;color:#4A3600}
.mk.no{animation:shake .35s}
@keyframes shake{25%{margin-left:-7px}50%{margin-left:7px}75%{margin-left:-4px}}
.bubble{min-height:58px;width:100%;max-width:760px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(20px,5vw,30px);font-weight:900;color:var(--deep);text-align:center}
.bubble small{font-size:15px;font-weight:700;color:var(--mute)}
.stars{font-size:20px;letter-spacing:2px}

/* 번호를 눌렀을 때 뜨는 큰 카드 */
.sheet{position:fixed;inset:0;background:rgba(20,40,30,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.sheet .in{background:var(--bg);border-radius:26px;padding:14px;width:min(92vw,560px);max-height:92vh;display:flex;flex-direction:column;align-items:center}
.sheet .pic{flex:none;width:100%;height:min(62vh,520px)}
.sheet .row{display:flex;gap:10px;width:100%;justify-content:center;margin-top:10px}
/* 폰을 가로로 돌렸을 때 — 버튼을 오른쪽 세로줄로 보내 그림 자리를 넓힌다 */
@media (orientation:landscape) and (max-height:520px){
  body{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto}
  header{grid-column:1/3;padding-bottom:2px} main{grid-column:1;grid-row:2;padding-right:4px} .dots{grid-column:1;grid-row:3;padding-bottom:6px}
  footer{grid-column:2;grid-row:2/4;flex-direction:column;padding:4px 12px 8px 6px;gap:8px}
  .big{height:48px;min-width:56px;font-size:20px} .big.main{flex:none;max-width:none;font-size:16px;width:100%}
  .word{min-height:40px;margin-top:2px;font-size:28px} .bubble{min-height:36px;margin-top:4px;font-size:20px}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl">그림 카드</h1>
  <button class="chip hide" id="bShuf">🔀 섞기</button>
  <button class="chip hide" id="bWord">가 낱말 보기</button>
  <button class="chip hide" id="bFind">🔍 찾기 놀이</button>
</header>
<main id="main"><p class="msg" id="msg">그림을 불러오고 있어요…</p></main>
<div class="dots hide" id="dots"></div>
<footer id="foot" class="hide"></footer>
<audio id="au" preload="auto"></audio>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var q=new URLSearchParams(location.search), did=q.get("d")||"";
var AU=$("au"), MAIN=$("main"), FOOT=$("foot"), MSG=$("msg");
var MOTION={}, deck=null;
var MAX=40, WAIT=5000;

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function say(src){ if(!src) return; try{AU.pause();AU.src=src;AU.currentTime=0;var p=AU.play();if(p&&p.catch)p.catch(function(){});}catch(e){} }
function getJSON(url,n,ok,fail){
  fetch(url+(n?("?t="+Date.now()):"")).then(function(r){if(!r.ok)throw 0;return r.json()}).then(ok).catch(function(){
    if(n<MAX){ if(fail)fail(n); setTimeout(function(){getJSON(url,n+1,ok,fail)},WAIT); }
    else MSG.textContent="그림을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.";
  });
}

/* ── 움직이는 그림: 영상이 있으면 영상, 없으면 여러 컷을 차례로 ── */
function Motion(frame, card){
  var m=card.k&&MOTION[card.k], self=this, timer=null, idx=0, imgs=[], label=null;
  this.has=!!m; this.playing=false; this.frames=m&&m.frames?m.frames.length:0;
  var still=el("img"); still.src=card.img; still.alt=card.word||""; still.draggable=false; frame.appendChild(still);
  if(!m) return;
  if(m.video){
    var v=el("video"); v.src=m.video; v.loop=true; v.muted=true; v.playsInline=true; v.setAttribute("playsinline",""); v.preload="auto"; v.className="hide"; frame.appendChild(v);
    this.play=function(){v.classList.remove("hide");v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){});self.playing=true};
    this.stop=function(){v.pause();v.classList.add("hide");self.playing=false};
    return;
  }
  (m.frames||[]).forEach(function(src){var im=el("img","f");im.src=src;im.draggable=false;frame.appendChild(im);imgs.push(im)});
  if(m.labels){label=el("div","step hide");frame.appendChild(label)}
  function show(i){ idx=i; imgs.forEach(function(im,k){im.classList.toggle("on",k===i)}); if(label){label.textContent=m.labels[i]||"";label.classList.toggle("hide",!m.labels[i]||!self.stepping)} }
  this.play=function(){ self.stepping=false; self.playing=true; show(0); clearInterval(timer); timer=setInterval(function(){show((idx+1)%imgs.length)}, m.ms||650) };
  this.stop=function(){ clearInterval(timer); timer=null; self.playing=false; self.stepping=false; imgs.forEach(function(im){im.classList.remove("on")}); if(label)label.classList.add("hide") };
  this.step=function(){ clearInterval(timer); timer=null; self.playing=false; var nx=self.stepping?(idx+1)%imgs.length:0; self.stepping=true; show(nx); return m.labels?m.labels[nx]:null };
  this.canStep=!!m.labels;
}

/* ── 플래시카드 ── */
function Cards(){
  var cards=deck.cards.slice(), i=0, showWord=false, revealed=false, mot=null;
  var pic=el("div","pic"), frame=el("div","frame"), word=el("div","word"); pic.appendChild(frame);
  MAIN.innerHTML=""; MAIN.appendChild(pic); MAIN.appendChild(word);
  var dots=$("dots"); dots.classList.remove("hide");
  $("bShuf").classList.toggle("hide",cards.length<3); $("bWord").classList.remove("hide");
  FOOT.classList.remove("hide");
  var bPrev=el("button","big","◀"), bSay=el("button","big main","🔊 듣기"), bMove=el("button","big hide","🎬"), bStep=el("button","big hide","①②③"), bNext=el("button","big","▶");
  [bPrev,bSay,bMove,bStep,bNext].forEach(function(b){FOOT.appendChild(b)});

  function drawWord(){
    var c=cards[i]; word.innerHTML="";
    if(showWord||revealed) word.textContent=c.word;
    else { var b=el("button",null,"무슨 그림일까? 👆"); b.onclick=reveal; word.appendChild(b); }
  }
  function reveal(){ revealed=true; drawWord(); say(cards[i].snd); }
  function draw(){
    var c=cards[i]; revealed=false; if(mot&&mot.stop&&mot.has)mot.stop();
    frame.innerHTML=""; mot=new Motion(frame,c);
    bMove.classList.toggle("hide",!mot.has); bMove.textContent="🎬 움직이기";
    bStep.classList.toggle("hide",!mot.canStep);
    bSay.classList.toggle("hide",!c.snd);
    drawWord();
    dots.innerHTML=""; cards.forEach(function(_,k){var d=el("i",k===i?"on":"");dots.appendChild(d)});
    bPrev.disabled=i===0; bNext.disabled=i===cards.length-1;
    var nx=cards[i+1]; if(nx){ (new Image()).src=nx.img; }
    if(mot.has) setTimeout(function(){ if(mot&&!mot.playing&&!mot.stepping){mot.play();bMove.textContent="⏸ 멈추기"} }, 500);
  }
  function go(d){ var n=i+d; if(n<0||n>=cards.length)return; i=n; draw(); }
  bPrev.onclick=function(){go(-1)}; bNext.onclick=function(){go(1)};
  bSay.onclick=reveal; frame.onclick=reveal;
  bMove.onclick=function(){ if(mot.playing){mot.stop();bMove.textContent="🎬 움직이기"} else {mot.play();bMove.textContent="⏸ 멈추기"} };
  bStep.onclick=function(){ mot.step(); bMove.textContent="🎬 움직이기"; };
  $("bWord").onclick=function(){ showWord=!showWord; this.classList.toggle("on",showWord); drawWord(); };
  $("bShuf").onclick=function(){ for(var k=cards.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1)),t=cards[k];cards[k]=cards[r];cards[r]=t} i=0; draw(); };
  var x0=null;
  pic.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  pic.addEventListener("touchend",function(e){ if(x0==null)return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50) go(dx<0?1:-1); },{passive:true});
  document.addEventListener("keydown",function(e){ if(e.key==="ArrowRight")go(1); else if(e.key==="ArrowLeft")go(-1); else if(e.key===" "){e.preventDefault();reveal()} });
  draw();
}

/* ── 장면 그림: 눌러 보기 / 찾기 놀이 ── */
function Scene(){
  var marks=deck.marks, finding=false, target=null, left=[], found=0, zoom=1;
  var wrap=el("div","scwrap"), scn=el("div","scn"), img=el("img"), bubble=el("div","bubble");
  img.src=deck.img; img.alt="장면 그림"; img.draggable=false; scn.appendChild(img); wrap.appendChild(scn);
  MAIN.innerHTML=""; MAIN.appendChild(wrap); MAIN.appendChild(bubble);
  FOOT.classList.remove("hide");
  var bOut=el("button","big","－"), bAgain=el("button","big main hide","🔊 다시 듣기"), bIn=el("button","big","＋");
  [bOut,bAgain,bIn].forEach(function(b){FOOT.appendChild(b)});
  $("bFind").classList.remove("hide");
  var btns=marks.map(function(m){
    var b=el("button","mk",String(m.no)); b.style.left=m.x+"%"; b.style.top=m.y+"%"; b.onclick=function(){tap(m,b)}; scn.appendChild(b); return b;
  });
  function hint(){ bubble.innerHTML=finding?"":"<small>번호를 누르면 그 친구가 뭐 하는지 들려줘요"+(innerHeight>innerWidth?" · 폰을 가로로 돌리면 더 커요":"")+"</small>"; }
  /* 기본 크기 = 그림 전체가 한눈에 들어오는 크기(가로·세로 중 모자란 쪽에 맞춤), ＋/－로 키운다 */
  function fit(){ var r=(img.naturalWidth||2000)/(img.naturalHeight||1180); return Math.min(wrap.clientWidth-4,(wrap.clientHeight-4)*r); }
  function setZoom(z){ zoom=Math.max(1,Math.min(3,z)); scn.style.width=Math.round(fit()*zoom)+"px"; bOut.disabled=zoom<=1; bIn.disabled=zoom>=3; }
  img.onload=function(){setZoom(zoom)}; window.addEventListener("resize",function(){setZoom(zoom)});
  bIn.onclick=function(){setZoom(zoom+.5)}; bOut.onclick=function(){setZoom(zoom-.5)};
  function clear(){ btns.forEach(function(b){b.classList.remove("sel","ok","no")}); }
  function ask(){
    if(!left.length){ bubble.innerHTML="다 찾았어요! 🎉 <span class='stars'>"+"⭐".repeat(found)+"</span>"; bAgain.textContent="🔁 한 번 더"; bAgain.classList.remove("hide"); target=null; return; }
    target=left.shift(); bubble.innerHTML="「"+target.word+"」 친구를 찾아봐!"; bAgain.textContent="🔊 다시 듣기"; bAgain.classList.remove("hide"); say(target.snd);
  }
  function start(){ finding=true; found=0; clear(); left=marks.slice().sort(function(){return Math.random()-.5}); ask(); }
  function tap(m,b){
    if(finding){
      if(!target) return;
      if(m===target){ b.classList.add("ok"); found++; bubble.innerHTML="맞아요! 「"+m.word+"」 ⭐"; say(m.snd); setTimeout(ask,1500); target=null; }
      else { b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); }
      return;
    }
    clear(); b.classList.add("sel"); bubble.textContent=m.word; say(m.snd);
    if(m.img) openCard(m);
  }
  bAgain.onclick=function(){ if(!finding)return; if(target)say(target.snd); else start(); };
  $("bFind").onclick=function(){ if(finding){ finding=false; this.classList.remove("on"); this.textContent="🔍 찾기 놀이"; bAgain.classList.add("hide"); clear(); hint(); } else { this.classList.add("on"); this.textContent="👆 눌러 보기"; start(); } };
  function openCard(m){
    var sh=el("div","sheet"), inn=el("div","in"), pic=el("div","pic"), frame=el("div","frame"), w=el("div","word",m.word), row=el("div","row");
    pic.appendChild(frame); inn.appendChild(pic); inn.appendChild(w); inn.appendChild(row); sh.appendChild(inn);
    var mot=new Motion(frame,m);
    var bS=el("button","big main","🔊 듣기"), bM=el("button","big"+(mot.has?"":" hide"),"🎬"), bX=el("button","big","✕");
    row.appendChild(bS); row.appendChild(bM); row.appendChild(bX);
    bS.onclick=function(){say(m.snd)}; frame.onclick=function(){say(m.snd)};
    bM.onclick=function(){ if(mot.playing)mot.stop(); else mot.play(); };
    function close(){ if(mot.has)mot.stop(); sh.remove(); }
    bX.onclick=close; sh.onclick=function(e){ if(e.target===sh)close(); };
    document.body.appendChild(sh);
    if(mot.has) setTimeout(function(){mot.play()},400);
  }
  setZoom(1); hint();
}

function boot(d){
  deck=d; $("ttl").textContent=d.tag||"그림 카드";
  document.title="용디쌤 · "+(d.tag||"그림 카드");
  if(d.kind==="scene") Scene(); else Cards();
}
if(!/^[0-9a-f]{8,32}$/.test(did)){ MSG.innerHTML="학습지에 있는 <b>📱 QR</b>을 찍으면<br>그림 카드가 여기에 열려요."; }
else{
  fetch("m/index.json").then(function(r){return r.ok?r.json():{}}).catch(function(){return {}}).then(function(m){
    MOTION=m||{};
    getJSON("d/"+did+".json",0,boot,function(n){ MSG.textContent="그림을 준비하고 있어요… 잠시만 기다려 주세요 ("+((n+1)*5)+"초)"; });
  });
}
})();
</script>
</body>
</html>
